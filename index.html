<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
    <style>
        body { font-family: Tahoma; text-align: center; padding: 50px; direction: rtl; background: #f0f2f5; }
        .box { background: white; padding: 40px; border-radius: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; margin: 10px; font-size: 18px; border: none; border-radius: 12px; color: white; cursor: pointer; width: 90%; }
        .btn-user { background: #4CAF50; }
        .btn-admin { background: #1565C0; }
        .btn-logout { background: #C62828; margin-top: 20px; }
        .result { margin: 20px 0; padding: 15px; background: #e8e8e8; border-radius: 10px; }
        .hidden { display: none; }
        .admin-area { background: #E3F2FD; padding: 20px; border-radius: 12px; margin: 10px 0; border: 2px solid #1565C0; }
        input { padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 10px; width: 90%; text-align: center; }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h1>🏢 دپارتمان املاک</h1>
    <div class="result" id="result">لطفاً یکی از دکمه‌ها رو بزن</div>

    <button class="btn-user" onclick="loginUser()">👤 ورود کاربر</button>
    <button class="btn-admin" onclick="showAdmin()">👑 ورود مدیر</button>

    <div class="admin-area hidden" id="adminBox">
        <p>🔑 رمز مدیر رو وارد کن</p>
        <input type="password" id="adminPass" placeholder="رمز عبور">
        <br><br>
        <button onclick="loginAdmin()" style="background:#1565C0;width:90%;">✅ تایید</button>
        <button onclick="hideAdmin()" style="background:#999;width:90%;margin-top:5px;">❌ انصراف</button>
    </div>
</div>

<div class="box hidden" id="mainBox">
    <h1>🏢 دپارتمان املاک</h1>
    <div class="result" id="mainResult">✅ وارد شدی!</div>
    <button class="btn-logout" onclick="logout()">🚪 خروج</button>
</div>

<script>
    function setResult(text) {
        document.getElementById('result').textContent = text;
    }

    function loginUser() {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('mainBox').classList.remove('hidden');
        document.getElementById('mainResult').textContent = '👋 خوش آمدی کاربر عزیز!';
        alert('✅ وارد شدی!');
    }

    function showAdmin() {
        document.getElementById('adminBox').classList.remove('hidden');
        setResult('🔑 رمز مدیر رو وارد کن');
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPass').focus();
    }

    function hideAdmin() {
        document.getElementById('adminBox').classList.add('hidden');
        setResult('❌ انصراف');
        document.getElementById('adminPass').value = '';
    }

    function loginAdmin() {
        var pass = document.getElementById('adminPass').value;
        if (pass === '26742674') {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('mainBox').classList.remove('hidden');
            document.getElementById('mainResult').textContent = '👑 خوش آمدی مدیر!';
            alert('👑 وارد شدی!');
            document.getElementById('adminBox').classList.add('hidden');
        } else {
            setResult('❌ رمز اشتباهه!');
            alert('❌ رمز اشتباهه!');
            document.getElementById('adminPass').value = '';
            document.getElementById('adminPass').focus();
        }
    }

    function logout() {
        document.getElementById('mainBox').classList.add('hidden');
        document.getElementById('loginBox').classList.remove('hidden');
        setResult('🚪 خارج شدی');
        alert('🚪 خارج شدی!');
    }

    // ورود با Enter
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var adminBox = document.getElementById('adminBox');
            if (!adminBox.classList.contains('hidden')) {
                loginAdmin();
            }
        }
    });

    console.log('✅ برنامه با موفقیت اجرا شد!');
</script>

</body>
</html>
