<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <button onclick="loginUser()">ورود کاربر</button>
    <button onclick="loginAdmin()">ورود مدیر</button>
    <div id="result"></div>

    <script>
        const SUPABASE_URL = 'https://zymwhrkmabujxoyiwqnk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_YNr6t65uutf98DupHUytTQ_Eynzayit';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loginUser() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .insert([{ 
                        id: 'user_' + Date.now(),
                        user_number: 1,
                        name: 'کاربر تست',
                        date: new Date().toISOString()
                    }])
                    .select();
                    
                if (error) throw error;
                document.getElementById('result').innerHTML = '✅ کاربر وارد شد: ' + JSON.stringify(data);
            } catch(e) {
                document.getElementById('result').innerHTML = '❌ خطا: ' + e.message;
            }
        }

        async function loginAdmin() {
            const password = prompt('رمز عبور مدیر:');
            if (password === '26742674') {
                document.getElementById('result').innerHTML = '👑 مدیر وارد شد!';
            } else {
                document.getElementById('result').innerHTML = '❌ رمز اشتباه!';
            }
        }
    </script>
</body>
</html>
