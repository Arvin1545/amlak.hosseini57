<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تست ساده</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
</head>
<body>
    <h2>🧪 تست ساده Supabase</h2>
    <div id="log"></div>

    <script>
        const log = document.getElementById('log');
        
        log.innerHTML += '🔄 شروع تست...<br>';
        
        // صبر برای لود
        let count = 0;
        const interval = setInterval(() => {
            count++;
            log.innerHTML += `⏳ تلاش ${count}...<br>`;
            
            if (typeof window.supabase !== 'undefined') {
                clearInterval(interval);
                log.innerHTML += '✅ Supabase پیدا شد!<br>';
                
                try {
                    const client = window.supabase.createClient(
                        'https://zymwhrkmabujxoyiwqnk.supabase.co',
                        'sb_publishable_YNr6t65uutf98DupHUytTQ_Eynzayit'
                    );
                    log.innerHTML += '✅ کلاینت ساخته شد!<br>';
                    
                    // تست
                    client.from('estate_properties')
                        .select('*')
                        .limit(1)
                        .then(({data, error}) => {
                            if (error) {
                                log.innerHTML += `❌ خطا: ${error.message}<br>`;
                            } else {
                                log.innerHTML += `✅ موفق! ${data.length} رکورد<br>`;
                            }
                        });
                } catch(e) {
                    log.innerHTML += `❌ خطا: ${e.message}<br>`;
                }
            } else if (count > 20) {
                clearInterval(interval);
                log.innerHTML += '❌ Supabase پیدا نشد!<br>';
            }
        }, 500);
    </script>
</body>
</html>
