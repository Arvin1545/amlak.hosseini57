<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تست Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
</head>
<body>
    <h1>🔌 تست اتصال به Supabase</h1>
    <div id="result" style="padding:20px;font-size:18px;">در حال تست...</div>
    <button onclick="testConnection()" style="padding:10px 20px;font-size:16px;">🔄 تست مجدد</button>

    <script>
        // ===== کلیدهای تو =====
        const URL = 'https://zymwhrkmabujxoyiwqnk.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bXdocmttYWJ1anhveWl3cW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDAzNTEsImV4cCI6MjEwMjcxNjM1MX0.DMuF9CwlH2awz1dNTEKQgzFeNXgX3IRTdC3fT8MOVpM';

        async function testConnection() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ در حال تست...';
            result.style.color = '#E65100';

            try {
                // بررسی وجود Supabase
                if (typeof supabase === 'undefined' && typeof window.supabase === 'undefined') {
                    result.innerHTML = '❌ کتابخانه Supabase بارگذاری نشد!';
                    result.style.color = '#C62828';
                    return;
                }

                const supabaseObj = typeof supabase !== 'undefined' ? supabase : window.supabase;
                const client = supabaseObj.createClient(URL, KEY);
                result.innerHTML = '✅ کلاینت ساخته شد! در حال تست اتصال...';

                // تست ۱: بررسی جدول estate_properties
                const response1 = await client
                    .from('estate_properties')
                    .select('count', { count: 'exact', head: true });

                if (response1.error) {
                    if (response1.error.code === 'PGRST301') {
                        result.innerHTML = '❌ جدول estate_properties وجود ندارد! لطفاً جدول رو بسازید.';
                        result.style.color = '#C62828';
                        return;
                    } else {
                        result.innerHTML = '❌ خطا: ' + response1.error.message;
                        result.style.color = '#C62828';
                        return;
                    }
                }

                // تست ۲: بررسی جدول public_messages
                const response2 = await client
                    .from('public_messages')
                    .select('count', { count: 'exact', head: true });

                if (response2.error && response2.error.code === 'PGRST301') {
                    result.innerHTML = '⚠️ جدول public_messages وجود ندارد! (ولی بقیه چیزا کار میکنه)';
                    result.style.color = '#E65100';
                    return;
                }

                result.innerHTML = '✅ اتصال به Supabase کاملاً موفق بود! 🎉\n\n' +
                    '📊 estate_properties: موجود\n' +
                    '📊 public_messages: موجود';
                result.style.color = '#2E7D32';

            } catch (e) {
                result.innerHTML = '❌ خطا: ' + e.message;
                result.style.color = '#C62828';
                console.error('❌ خطا:', e);
            }
        }

        // اجرا هنگام لود
        testConnection();
    </script>
</body>
</html>
