<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - نسخه اندروید</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .box {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }
        h1 {
            color: #1565C0;
            font-size: 24px;
            margin-bottom: 5px;
        }
        h1 span { color: #FFD700; }
        p.sub {
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin: 8px 0;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-user { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
        .btn-admin { background: linear-gradient(135deg, #1565C0, #0D47A1); }
        .btn-confirm { background: #1565C0; }
        .btn-cancel { background: #999; }
        .result-box {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            font-size: 14px;
            color: #333;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hidden { display: none !important; }
        .admin-area {
            margin-top: 15px;
            padding: 20px;
            background: #E3F2FD;
            border-radius: 14px;
            border: 2px solid #1565C0;
        }
        .admin-area input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            direction: ltr;
            margin: 10px 0;
        }
        .admin-area input:focus {
            border-color: #1565C0;
            outline: none;
        }
        .btn-group { display: flex; gap: 8px; }
        .btn-group .btn { flex: 1; margin: 0; }
        .status-green { border-color: #4CAF50 !important; }
        .status-blue { border-color: #1565C0 !important; }
        .status-gold { border-color: #FFD700 !important; }
        .status-red { border-color: #f44336 !important; }
    </style>
</head>
<body>

<div class="box">
    <h1>🏢 دپارتمان <span>املاک حسینی</span></h1>
    <p class="sub">به سامانه خوش آمدید</p>

    <div class="result-box" id="resultBox">
        👋 روی یکی از دکمه‌ها کلیک کن
    </div>

    <button class="btn btn-user" onclick="loginUser()">👤 ورود کاربر عادی</button>
    <button class="btn btn-admin" onclick="showAdminPanel()">👑 ورود مدیر</button>

    <div class="admin-area hidden" id="adminPanel">
        <p style="font-weight:bold;color:#1565C0;">🔑 رمز مدیر رو وارد کن</p>
        <input type="password" id="adminPass" placeholder="رمز عبور مدیر">
        <div class="btn-group">
            <button class="btn btn-confirm" onclick="loginAdmin()">✅ تایید</button>
            <button class="btn btn-cancel" onclick="hideAdminPanel()">❌ انصراف</button>
        </div>
    </div>
</div>

<script>
    function setResult(text, className = '') {
        const box = document.getElementById('resultBox');
        box.textContent = text;
        box.className = 'result-box';
        if (className) box.classList.add(className);
    }

    function loginUser() {
        setResult('✅ خوش آمدی کاربر عزیز!', 'status-green');
        alert('✅ وارد شدی!');
    }

    function showAdminPanel() {
        document.getElementById('adminPanel').classList.remove('hidden');
        setResult('🔑 رمز مدیر رو وارد کن', 'status-blue');
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPass').focus();
    }

    function hideAdminPanel() {
        document.getElementById('adminPanel').classList.add('hidden');
        setResult('❌ انصراف از ورود مدیر', '');
        document.getElementById('adminPass').value = '';
    }

    function loginAdmin() {
        const pass = document.getElementById('adminPass').value;
        if (pass === '26742674') {
            setResult('👑 خوش آمدی مدیر گرامی!', 'status-gold');
            alert('👑 وارد شدی!');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        } else {
            setResult('❌ رمز عبور اشتباه است! دوباره تلاش کن', 'status-red');
            alert('❌ رمز اشتباهه!');
            document.getElementById('adminPass').value = '';
            document.getElementById('adminPass').focus();
        }
    }

    // ورود با کلید Enter
    document.addEventListener('DOMContentLoaded', function() {
        const passInput = document.getElementById('adminPass');
        if (passInput) {
            passInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginAdmin();
                }
            });
        }
    });

    console.log('✅ برنامه با موفقیت اجرا شد!');
    console.log('👤 دکمه‌ها با onclick کار میکنن');
</script>

</body>
</html>
