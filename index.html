<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 املاک حسینی - تست</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        body {
            font-family: Tahoma;
            background: #f0f2f5;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
            text-align: center;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            width: 100%;
            margin: 6px 0;
            transition: 0.3s;
        }
        .btn-user {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
        }
        .btn-admin {
            background: linear-gradient(135deg, #1565C0, #0D47A1);
        }
        .btn-retry {
            background: #FF8F00;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 13px;
        }
        .status.loading {
            background: #FFF3E0;
            color: #E65100;
        }
        .status.success {
            background: #E8F5E9;
            color: #2E7D32;
        }
        .status.error {
            background: #FFEBEE;
            color: #C62828;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #1565C0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .hidden {
            display: none !important;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin: 6px 0;
        }
        .login-hint {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        .error-detail {
            font-size: 12px;
            color: #C62828;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>🏢 املاک حسینی</h2>
        <p id="subText">به سامانه خوش آمدید</p>
    </div>

    <!-- وضعیت اتصال -->
    <div class="box" id="statusBox">
        <div id="statusMessage" class="status loading">
            <span class="spinner"></span> در حال اتصال به سرور...
        </div>
        <div id="errorDetail" class="error-detail hidden"></div>
        <button class="btn btn-retry hidden" id="retryBtn" onclick="retryConnection()">🔄 تلاش مجدد</button>
    </div>

    <!-- دکمه‌های ورود -->
    <div class="box" id="loginBox">
        <button class="btn btn-user" onclick="loginAsUser()">👤 ورود کاربر عادی</button>
        <button class="btn btn-admin" onclick="showAdminLogin()">👑 ورود مدیر</button>

        <div id="adminArea" class="hidden" style="margin-top:10px;">
            <input type="password" id="adminPass" placeholder="رمز عبور مدیر">
            <button class="btn btn-admin" onclick="loginAdmin()">✅ تایید</button>
            <button class="btn" style="background:#999;" onclick="hideAdminLogin()">❌ انصراف</button>
        </div>

        <div class="login-hint" id="loginHint">👤 کاربران عادی بدون رمز وارد می‌شوند</div>
        <div id="adminFullMsg" class="hidden" style="color:#E65100;font-weight:bold;margin-top:8px;">⚠️ ظرفیت مدیران تکمیل شد</div>
    </div>

    <!-- برنامه اصلی -->
    <div class="box hidden" id="mainApp">
        <h3 id="welcomeUser">👋 خوش آمدید</h3>
        <button class="btn" style="background:#C62828;" onclick="logout()">🚪 خروج</button>
        <div id="propertyList" style="margin-top:10px;text-align:right;"></div>
    </div>

    <script>
        // ============================================================
        // تنظیمات
        // ============================================================
        const ADMIN_PASSWORD = '26742674';
        const MAX_ADMINS = 4;
        const SUPABASE_URL = 'https://zymwhrkmabujxoyiwqnk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_YNr6t65uutf98DupHUytTQ_Eynzayit';

        let supabaseClient = null;
        let isAdmin = false;
        let currentUser = null;
        let properties = [];
        let adminCount = 0;
        let isConnecting = false;

        // ============================================================
        // مدیریت وضعیت
        // ============================================================
        function setStatus(message, type, showRetry = false) {
            const el = document.getElementById('statusMessage');
            const retryBtn = document.getElementById('retryBtn');
            const errorDetail = document.getElementById('errorDetail');

            el.className = 'status ' + type;
            el.innerHTML = message;

            if (type === 'error') {
                retryBtn.classList.remove('hidden');
                if (showRetry) {
                    errorDetail.classList.remove('hidden');
                    errorDetail.textContent = '⚠️ خطا: ' + showRetry;
                }
            } else {
                retryBtn.classList.add('hidden');
                errorDetail.classList.add('hidden');
            }
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.className = 'status ' + type;
            el.innerHTML = '🔔 ' + msg;
            setTimeout(() => {
                if (el.className.includes(type)) {
                    el.className = 'status loading';
                    el.innerHTML = '<span class="spinner"></span> در حال اتصال...';
                }
            }, 3000);
        }

        function showLoading(show) {
            const el = document.getElementById('statusMessage');
            if (show) {
                el.className = 'status loading';
                el.innerHTML = '<span class="spinner"></span> در حال بارگذاری...';
            }
        }

        // ============================================================
        // اتصال به Supabase (ساده شده)
        // ============================================================
        async function initSupabase() {
            if (isConnecting) return;
            isConnecting = true;

            try {
                setStatus('<span class="spinner"></span> در حال اتصال به سرور...', 'loading');

                // صبر برای لود Supabase
                let supabaseObj = null;
                let attempts = 0;

                while (attempts < 30) {
                    if (typeof supabase !== 'undefined' && supabase && typeof supabase.createClient === 'function') {
                        supabaseObj = supabase;
                        break;
                    }
                    if (typeof window.supabase !== 'undefined' && window.supabase && typeof window.supabase
                        .createClient === 'function') {
                        supabaseObj = window.supabase;
                        break;
                    }
                    await new Promise(r => setTimeout(r, 200));
                    attempts++;
                }

                if (!supabaseObj) {
                    throw new Error('کتابخانه Supabase بارگذاری نشد!');
                }

                // ساخت کلاینت
                supabaseClient = supabaseObj.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ کلاینت ساخته شد');

                // تست اتصال (با timeout)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                try {
                    const response = await supabaseClient
                        .from('estate_properties')
                        .select('count', { count: 'exact', head: true });

                    clearTimeout(timeoutId);

                    if (response.error) {
                        if (response.error.code === 'PGRST301') {
                            throw new Error('❌ جدول estate_properties وجود ندارد! لطفاً جدول را بسازید.');
                        } else {
                            throw new Error('❌ خطا: ' + response.error.message);
                        }
                    }

                    setStatus('✅ اتصال به سرور برقرار شد!', 'success');
                    console.log('✅ تست اتصال موفق');
                    return true;

                } catch (e) {
                    clearTimeout(timeoutId);
                    if (e.name === 'AbortError') {
                        throw new Error('⏱️ زمان اتصال به سرور تمام شد! اینترنت خود را بررسی کنید.');
                    }
                    throw e;
                }

            } catch (e) {
                console.error('❌ خطا:', e);
                setStatus('❌ ' + e.message, 'error', 'اینترنت خود را بررسی کنید و دوباره تلاش کنید');
                return false;
            } finally {
                isConnecting = false;
            }
        }

        // ============================================================
        // تلاش مجدد
        // ============================================================
        async function retryConnection() {
            document.getElementById('retryBtn').classList.add('hidden');
            document.getElementById('errorDetail').classList.add('hidden');
            await initSupabase();
            if (supabaseClient) {
                await loadData();
            }
        }

        // ============================================================
        // توابع کاربر
        // ============================================================
        async function getAdminCount() {
            if (!supabaseClient) return 0;
            try {
                const response = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('key', 'admin_count')
                    .single();
                adminCount = parseInt(response.data?.value) || 0;
                return adminCount;
            } catch (e) { return 0; }
        }

        async function incrementAdminCount() {
            if (!supabaseClient) return;
            adminCount++;
            await supabaseClient
                .from('settings')
                .upsert({ key: 'admin_count', value: String(adminCount), updated_at: new Date().toISOString() });
        }

        async function registerUser() {
            if (!supabaseClient) return null;
            try {
                const response = await supabaseClient
                    .from('users')
                    .select('user_number')
                    .order('user_number', { ascending: false })
                    .limit(1);
                const userNumber = (response.data?.length > 0) ? response.data[0].user_number + 1 : 1;

                const newUser = {
                    id: 'user_' + Date.now().toString(36),
                    user_number: userNumber,
                    name: 'کاربر ' + userNumber,
                    phone: '0900' + String(userNumber).padStart(8, '0'),
                    verified: true,
                    date: new Date().toISOString(),
                    last_login: new Date().toISOString()
                };

                const result = await supabaseClient
                    .from('users')
                    .insert([newUser])
                    .select();
                return result.data?.[0] || null;
            } catch (e) { return null; }
        }

        // ============================================================
        // بارگذاری داده
        // ============================================================
        async function loadData() {
            if (!supabaseClient) return;
            try {
                showLoading(true);
                const response = await supabaseClient
                    .from('estate_properties')
                    .select('*')
                    .order('created_at', { ascending: false });
                properties = response.data || [];
                console.log('✅ ' + properties.length + ' ملک بارگذاری شد');
                renderProperties();
            } catch (e) {
                console.error(e);
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        // نمایش املاک
        // ============================================================
        function renderProperties() {
            const container = document.getElementById('propertyList');
            if (!properties.length) {
                container.innerHTML = '🏠 هیچ ملکی یافت نشد';
                return;
            }
            let html = '';
            for (let i = 0; i < Math.min(properties.length, 5); i++) {
                const p = properties[i];
                html += `
                    <div style="background:#f5f5f5;padding:10px;border-radius:8px;margin:6px 0;border-right:4px solid #1565C0;">
                        <b>${p.title || 'بدون عنوان'}</b>
                        <div style="font-size:12px;color:#666;">📍 ${p.address || 'آدرس ندارد'}</div>
                        <div style="font-size:14px;color:#2E7D32;font-weight:bold;">💰 ${Number(p.price).toLocaleString()} تومان</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // ============================================================
        // ورود کاربر
        // ============================================================
        async function loginAsUser() {
            if (!supabaseClient) {
                showToast('❌ اتصال به سرور برقرار نیست!', 'error');
                return;
            }

            showLoading(true);
            try {
                const user = await registerUser();
                if (!user) {
                    throw new Error('ثبت کاربر ناموفق!');
                }

                isAdmin = false;
                currentUser = { role: 'user', id: user.id, name: user.name };
                localStorage.setItem('amlak_user', JSON.stringify({ role: 'user', id: user.id }));

                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('welcomeUser').textContent = '👤 ' + user.name + ' خوش آمدید';

                showToast('✅ ورود موفق!', 'success');
                await loadData();

            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function showAdminLogin() {
            if (adminCount >= MAX_ADMINS) {
                document.getElementById('adminFullMsg').classList.remove('hidden');
                return;
            }
            document.getElementById('adminArea').classList.remove('hidden');
            document.getElementById('adminPass').focus();
        }

        function hideAdminLogin() {
            document.getElementById('adminArea').classList.add('hidden');
            document.getElementById('adminPass').value = '';
            document.getElementById('adminFullMsg').classList.add('hidden');
        }

        async function loginAdmin() {
            if (adminCount >= MAX_ADMINS) {
                showToast('⚠️ ظرفیت مدیران تکمیل شد!', 'error');
                return;
            }

            const pass = document.getElementById('adminPass').value.trim();
            if (!pass) {
                showToast('⚠️ رمز عبور را وارد کنید!', 'warning');
                return;
            }

            if (pass === ADMIN_PASSWORD) {
                showLoading(true);
                try {
                    isAdmin = true;
                    const adminId = 'admin_' + Date.now().toString(36);
                    currentUser = { role: 'admin', id: adminId, name: 'مدیر' };
                    localStorage.setItem('amlak_user', JSON.stringify({ role: 'admin', id: adminId }));

                    await incrementAdminCount();

                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('welcomeUser').textContent = '👑 مدیر خوش آمدید';

                    showToast('✅ ورود مدیر موفق!', 'success');
                    await loadData();

                } catch (e) {
                    showToast('❌ ' + e.message, 'error');
                } finally {
                    showLoading(false);
                    hideAdminLogin();
                }
            } else {
                showToast('❌ رمز عبور اشتباه است!', 'error');
                document.getElementById('adminPass').value = '';
                document.getElementById('adminPass').focus();
            }
        }

        // ============================================================
        // خروج
        // ============================================================
        function logout() {
            localStorage.removeItem('amlak_user');
            currentUser = null;
            isAdmin = false;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('welcomeUser').textContent = '';
            hideAdminLogin();
            showToast('🚪 خروج موفق', 'success');
        }

        // ============================================================
        // بررسی کاربر ذخیره شده
        // ============================================================
        async function checkSavedUser() {
            try {
                const saved = JSON.parse(localStorage.getItem('amlak_user'));
                if (saved && supabaseClient) {
                    if (saved.role === 'admin') {
                        isAdmin = true;
                        currentUser = { role: 'admin', id: saved.id, name: 'مدیر' };
                        document.getElementById('loginBox').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('welcomeUser').textContent = '👑 مدیر خوش آمدید';
                        await loadData();
                    } else {
                        // بررسی کاربر در دیتابیس
                        const users = await supabaseClient
                            .from('users')
                            .select('*')
                            .eq('id', saved.id);
                        if (users.data?.length > 0) {
                            isAdmin = false;
                            currentUser = { role: 'user', id: saved.id, name: users.data[0].name };
                            document.getElementById('loginBox').classList.add('hidden');
                            document.getElementById('mainApp').classList.remove('hidden');
                            document.getElementById('welcomeUser').textContent = '👤 ' + users.data[0].name + ' خوش آمدید';
                            await loadData();
                        }
                    }
                }
            } catch (e) { console.log('No saved user'); }
        }

        // ============================================================
        // شروع برنامه
        // ============================================================
        async function init() {
            console.log('🚀 شروع برنامه...');

            // اتصال به Supabase
            const connected = await initSupabase();

            if (connected && supabaseClient) {
                // دریافت تعداد مدیران
                await getAdminCount();

                // بررسی کاربر ذخیره شده
                await checkSavedUser();
            }

            // اگر هیچ کاربری وارد نشده، صفحه ورود رو نشون بده
            if (document.getElementById('loginBox').classList.contains('hidden') === false) {
                document.getElementById('loginBox').classList.remove('hidden');
            }

            console.log('✅ برنامه آماده است!');
        }

        // ============================================================
        // اجرا
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

</body>
</html>
