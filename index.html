<!DOCTYPE html>
<html>
<head>
    <title>تست Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>تست اتصال به Supabase</h1>
    <button onclick="test()">تست اتصال</button>
    <div id="result"></div>

    <script>
        // کلیدهای Supabase رو اینجا بذار
        const SUPABASE_URL = 'https://zymwhrkmabujxoyiwqnk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_YNr6t65uutf98DupHUytTQ_Eynzayit';

        async function test() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ در حال تست...';

            try {
                // تست 1: آیا supabase تعریف شده؟
                if (typeof supabase === 'undefined') {
                    result.innerHTML = '❌ کتابخانه supabase لود نشد!';
                    return;
                }

                // تست 2: ایجاد کلاینت
                const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                result.innerHTML = '✅ کلاینت ساخته شد. در حال تست دیتابیس...';

                // تست 3: اتصال به دیتابیس
                const { data, error } = await client
                    .from('estate_properties')
                    .select('*')
                    .limit(1);

                if (error) {
                    result.innerHTML = '❌ خطای دیتابیس: ' + error.message;
                    console.log('خطا:', error);
                    return;
                }

                result.innerHTML = '✅ اتصال برقرار است! تعداد رکوردها: ' + (data ? data.length : 0);
                console.log('داده:', data);

            } catch (err) {
                result.innerHTML = '❌ خطا: ' + err.message;
                console.log('خطا:', err);
            }
        }
    </script>
</body>
</html>
