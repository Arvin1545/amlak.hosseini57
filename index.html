<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تست اتصال Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
</head>
<body>
    <h2>🧪 تست اتصال</h2>
    <div id="status">در حال تست...</div>
    <div id="data"></div>

    <script>
        const SUPABASE_URL = 'https://zymwhrkmabujxoyiwqnk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_YNr6t65uutf98DupHUytTQ_Eynzayit';

        async function testConnection() {
            const status = document.getElementById('status');
            const dataDiv = document.getElementById('data');
            
            try {
                status.textContent = '🔄 در حال اتصال...';
                
                // ===== ایجاد کلاینت با window =====
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                status.textContent = '✅ کلاینت ساخته شد!';
                
                // ===== تست خواندن از estate_properties =====
                const { data, error } = await supabaseClient
                    .from('estate_properties')
                    .select('*')
                    .limit(3);
                    
                if (error) {
                    status.textContent = '❌ خطا: ' + error.message;
                    return;
                }
                
                status.textContent = '✅ اتصال برقرار است! ' + data.length + ' ملک پیدا شد.';
                
                // ===== نمایش داده‌ها =====
                let html = '<h3>📋 ۳ ملک آخر:</h3><ul>';
                data.forEach(item => {
                    html += `<li>🏠 ${item.title} - ${item.type === 'sale' ? '💰 فروش' : '🔑 اجاره'}</li>`;
                });
                html += '</ul>';
                dataDiv.innerHTML = html;
                
            } catch (error) {
                status.textContent = '❌ خطا: ' + error.message;
                console.error(error);
            }
        }

        // اجرا بعد از لود
        window.onload = function() {
            // صبر برای لود supabase
            let count = 0;
            const interval = setInterval(() => {
                count++;
                if (typeof window.supabase !== 'undefined') {
                    clearInterval(interval);
                    testConnection();
                } else if (count > 30) {
                    clearInterval(interval);
                    document.getElementById('status').textContent = '❌ Supabase لود نشد!';
                }
            }, 500);
        };
    </script>
</body>
</html>
